<div class="content">
  <h1>Edit Book</h1>
  <form #form="ngForm" (ngSubmit)="saveBookByForm(form)">
    <section>
      <nav>Book Info</nav>
      <div>
        <!-- <input
          placeholder="Book Name"
          [ngModel]="bookName"
          (ngModelChange)="bookName = $event"
          name="bookName"
        /> -->
        <input [hidden]="true" type="number" [(ngModel)]="book.id" name="id" />
        <input placeholder="Book Name" [(ngModel)]="book.name" name="name" />
        <input placeholder="Author" [(ngModel)]="book.author" name="author" />
        <input
          type="date"
          placeholder="Published Date"
          [(ngModel)]="book.publishedYear"
          name="publishedYear"
        />
        <input type="number" placeholder="Rating (1–5)" [(ngModel)]="book.rating" name="rating" />
      </div>
    </section>

    <section ngModelGroup="publisher">
      <nav>Publisher</nav>
      <div>
        <input
          placeholder="Publisher Name"
          [(ngModel)]="book.publisher.publisherName"
          name="publisherName"
        />
        <div class="radio">
          <label
            ><input
              type="radio"
              value="traditional"
              [(ngModel)]="book.publisher.publisherType"
              name="publisherType"
            />
            Traditional</label
          >
          <label
            ><input
              type="radio"
              value="self-published"
              [(ngModel)]="book.publisher.publisherType"
              name="publisherType"
            />
            Self-Published</label
          >
          <label
            ><input
              type="radio"
              value="academic"
              [(ngModel)]="book.publisher.publisherType"
              name="publisherType"
            />
            Academic</label
          >
        </div>
      </div>
    </section>

    <section>
      <nav>Category</nav>
      <div>
        <select [(ngModel)]="book.category" name="category">
          <option value="">-- Select Category --</option>
          <option value="Programming">Programming</option>
          <option value="Algorithms">Algorithms</option>
          <option value="System Design">System Design</option>
          <option value="Software Engineering">Software Engineering</option>
        </select>
        <textarea
          placeholder="Description"
          [(ngModel)]="book.description"
          name="description"
        ></textarea>
      </div>
    </section>

    <div class="buttons">
      <button class="secondary" [routerLink]="['/books']">Cancel</button>
      <button [disabled]="form.submitted" (click)="saveBook()">Save</button>
      <button type="submit" [disabled]="form.submitted">Save By Form Value</button>
    </div>
  </form>
</div>
