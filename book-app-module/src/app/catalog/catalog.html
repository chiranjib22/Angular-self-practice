<div class="container">
  <div class="filters">
    <a class="button" (click)="ProductFilter = ''">All</a>
    <a class="button" (click)="ProductFilter = 'Programming'">Programming</a>
    <a class="button" (click)="ProductFilter = 'Algorithms'">Algorithms</a>
    <a class="button" (click)="ProductFilter = 'System Design'">System Design</a>
    <a class="button" (click)="ProductFilter = 'Software Engineering'">Software Eng.</a>
    <!-- <div>
      {{cartItems.length}}
    </div> -->
  </div>

  @if(products.length > 0){
      <ul class="products">
    @for (product of getFilterProducts(); track product?.id)
    {
    <li class="product-item">
      <app-product-details [product]="product" (buyClicked)="addToCart($event)"></app-product-details>
    </li>
    }
  </ul>
  }

</div>
